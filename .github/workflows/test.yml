name: CI
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - uses: actions/setup-node@v2
      with:
        node-version: '22'
    - name: Install modules
      run: npm i
    - name: Lint
      run: npm run lint
    - name: Run tests
      run: npm test
    - name: Build
      run: npm run build
    # `npm run build` regenerates publicApi.js/publicApi.d.ts from src/publicApi.ts.
    # If they differ from what is committed, the package's published types no longer
    # describe the source they came from.
    - name: Check generated extension API types are up to date
      run: git diff --exit-code -- publicApi.js publicApi.d.ts
    - name: Type check
      run: npm run typecheck
